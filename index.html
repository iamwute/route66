<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Route 66 Trip — Shared Patron Suggestions</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
        #header { background: linear-gradient(to right, #c8102e, #f4a261); color: white; padding: 20px; text-align: center; font-size: 1.8em; }
        #progress-container { background: white; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        #progress-text { font-size: 1.4em; font-weight: bold; margin-bottom: 8px; }
        #map { height: 68vh; width: 100%; min-height: 400px; } /* Added min-height for safety */
        #controls { padding: 12px; background: white; text-align: center; }
        button { padding: 10px 20px; margin: 5px; background: #c8102e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #a00; }
        .legend { position: absolute; bottom: 25px; right: 25px; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.25); z-index: 1000; font-size: 0.95em; pointer-events: none; }
        .admin-btn { background: #333; font-size: 0.9em; }
        .popup-content { min-width: 250px; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="header">🚗 Our Route 66 Adventure — Shared Patron Map (2026 Centennial)</div>
    
    <div id="progress-container">
        <div id="progress-text">0% Complete — Chicago to Santa Monica</div>
        <small>Click the map to add a public suggestion pin • Everyone sees the same pins</small>
    </div>

    <div id="controls">
        <button onclick="toggleAdmin()" class="admin-btn">🔑 Admin Mode</button>
        <button onclick="shareMap()">Share Map</button>
    </div>

    <div id="map"></div>

    <div class="legend">
        <strong>Legend</strong><br>
        🟢 Shared Patron Pins<br>
        🟠 Famous Stops<br>
        ⭐ Summer 2026 Events<br>
        <span style="color:#c8102e; font-weight:bold;">━━━</span> Current Progress
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // === SUPABASE FIXED INITIALIZATION ===
        const SUPABASE_URL = 'https://duggytpkrcqvebdwrphr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qRT_1b4lB4-sfrdUi2YtDw_zuJ2UC8y';
        
        // Use lowercase 'supabase' to access the library global from CDN
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const map = L.map('map').setView([38.5, -95], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const fullRouteCoords = [
            [41.8781, -87.6298], [39.7817, -89.6501], [38.6270, -90.1994],
            [37.2089, -93.2923], [36.1539, -95.9928], [35.4676, -97.5164],
            [35.2220, -101.8313], [35.0844, -106.6504], [35.1983, -111.6513],
            [34.5400, -112.4685], [34.0489, -111.0937], [34.0522, -118.2437]
        ];

        let progressLine = null;
        let currentProgress = 35;
        let patronMarkers = [];

        const famousStops = [
            {lat: 41.8781, lng: -87.6298, title: "Chicago Start", desc: "Official beginning at Grant Park"},
            {lat: 38.6270, lng: -90.1994, title: "Gateway Arch", desc: "St. Louis, MO — Iconic symbol"},
            {lat: 37.2089, lng: -93.2923, title: "Springfield, MO", desc: "Birthplace of Route 66"},
            {lat: 36.1947, lng: -95.7475, title: "Blue Whale of Catoosa", desc: "Oklahoma Roadside Classic"},
            {lat: 35.2220, lng: -101.8313, title: "Cadillac Ranch", desc: "Amarillo, TX Art"},
            {lat: 34.0522, lng: -118.2437, title: "Santa Monica Pier", desc: "Official end of the Mother Road"}
        ];

        const summerEvents = [
            {lat: 37.2089, lng: -93.2923, date: "April 30–May 3, 2026", title: "National Centennial Kickoff", desc: "Springfield, MO — Music and Parades"},
            {lat: 36.1539, lng: -95.9928, date: "June 27–28, 2026", title: "AAA Route 66 Road Fest", desc: "Tulsa, OK Major Event"}
        ];

        async function loadSharedPins() {
            const { data, error } = await sbClient.from('route66_pins').select('*').order('created_at', { ascending: false });
            if (error) { console.error("Supabase Error:", error); return; }

            patronMarkers.forEach(m => map.removeLayer(m.marker));
            patronMarkers = [];

            data.forEach(pin => {
                const popup = `<div class="popup-content"><strong>${pin.title}</strong><br>${pin.comment || ''}<br><br><small>Added: ${new Date(pin.created_at).toLocaleDateString()}</small></div>`;
                const marker = L.marker([pin.lat, pin.lng], {icon: L.divIcon({className: 'custom-div-icon', html: '🟢', iconSize: [25,25]})}).addTo(map).bindPopup(popup);
                patronMarkers.push({marker});
            });
        }

        async function addPatronPin(lat, lng) {
            const title = prompt("Place Name (e.g. 'Cozy Diner')");
            if (!title) return;
            const comment = prompt("Why should we stop here?");

            const { error } = await sbClient.from('route66_pins').insert([{ lat, lng, title, comment }]);
            if (error) {
                alert("Error: Check your Supabase RLS policies!");
            } else {
                loadSharedPins();
            }
        }

        function updateProgressLine() {
            if (progressLine) map.removeLayer(progressLine);
            const total = fullRouteCoords.length;
            const progPoints = Math.max(2, Math.ceil(total * (currentProgress / 100)));
            progressLine = L.polyline(fullRouteCoords.slice(0, progPoints), {
                color: '#c8102e', weight: 8, opacity: 0.8
            }).addTo(map);
            document.getElementById('progress-text').textContent = `${currentProgress}% Complete — Chicago to Santa Monica`;
        }

        function toggleAdmin() {
            const pass = prompt("Admin Password:");
            if (pass === "route66owner2026") {
                const newProg = prompt("Update progress (0-100):", currentProgress);
                if (newProg !== null) {
                    currentProgress = Math.max(0, Math.min(100, parseFloat(newProg) || 0));
                    localStorage.setItem('route66Progress', currentProgress);
                    updateProgressLine();
                }
            }
        }

        function shareMap() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("Link copied!"));
        }

        // Render fixed items
        famousStops.forEach(s => {
            L.marker([s.lat, s.lng], {icon: L.divIcon({className: 'stop-icon', html:'🟠', iconSize:[30,30]})}).addTo(map)
              .bindPopup(`<strong>${s.title}</strong><br>${s.desc}`);
        });

        summerEvents.forEach(e => {
            L.marker([e.lat, e.lng], {icon: L.divIcon({className: 'event-icon', html:'⭐', iconSize:[30,30]})}).addTo(map)
              .bindPopup(`<strong>${e.title}</strong><br>${e.date}<br>${e.desc}`);
        });

        map.on('click', e => addPatronPin(e.latlng.lat, e.latlng.lng));

        // Initial setup
        const saved = localStorage.getItem('route66Progress');
        if (saved) currentProgress = parseFloat(saved);
        updateProgressLine();
        loadSharedPins();

        // Fix for rendering bugs on mobile/Netlify
        setTimeout(() => map.invalidateSize(), 500);
    </script>
</body>
</html>
