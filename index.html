<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Our Route 66 Trip — Shared Patron Suggestions</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
        #header { background: linear-gradient(to right, #c8102e, #f4a261); color: white; padding: 20px; text-align: center; font-size: 1.8em; }
        #progress-container { background: white; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        #progress-text { font-size: 1.4em; font-weight: bold; margin-bottom: 8px; }
        #map { height: 68vh; width: 100%; }
        #controls { padding: 12px; background: white; text-align: center; }
        button { padding: 10px 20px; margin: 5px; background: #c8102e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #a00; }
        .legend { position: absolute; bottom: 25px; right: 25px; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.25); z-index: 1000; font-size: 0.95em; }
        .admin-btn { background: #333; font-size: 0.9em; }
        .popup-content { min-width: 280px; line-height: 1.5; }
        .action-btn { background: #c8102e; color: white; padding: 6px 12px; margin: 4px 2px; font-size: 0.9em; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">🚗 Our Route 66 Adventure — Shared Patron Map (2026 Centennial)</div>
    
    <div id="progress-container">
        <div id="progress-text">0% Complete — Chicago to Santa Monica</div>
        <small>Click the map to add a public suggestion pin • Everyone sees the same pins</small>
    </div>

    <div id="controls">
        <button onclick="toggleAdmin()" class="admin-btn">🔑 Admin Mode (Progress Only)</button>
        <button onclick="shareMap()">Share Map</button>
    </div>

    <div id="map"></div>

    <div class="legend">
        <strong>Legend</strong><br>
        🟢 Shared Patron Pins<br>
        🟠 Famous Stops (view only)<br>
        ⭐ Summer 2026 Events (view only)<br>
        <span style="color:#c8102e; font-weight:bold;">━━━</span> Progress Line
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // === YOUR CREDENTIALS ===
        const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_PUBLIC_KEY_HERE';
        const supabase = Supabase.createClient(https://duggytpkrcqvebdwrphr.supabase.co, sb_publishable_qRT_1b4lB4-sfrdUi2YtDw_zuJ2UC8y);

        const stadiaApiKey = "b56aae87-d856-41a2-85a9-5889d9fd62a7";

        const map = L.map('map').setView([38.5, -95], 5);
        L.tileLayer(`https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png?api_key=${stadiaApiKey}`, {
            attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; OpenMapTiles &copy; OpenStreetMap',
            maxZoom: 20
        }).addTo(map);

        const fullRouteCoords = [ /* same as before */ 
            [41.8781, -87.6298], [39.7817, -89.6501], [38.6270, -90.1994],
            [37.2089, -93.2923], [36.1539, -95.9928], [35.4676, -97.5164],
            [35.2220, -101.8313], [35.0844, -106.6504], [35.1983, -111.6513],
            [34.5400, -112.4685], [34.0489, -111.0937], [34.0522, -118.2437]
        ];

        let progressLine = null;
        let currentProgress = 35;
        let patronMarkers = [];

        // Famous stops and summer events (same arrays as previous versions)
        const famousStops = [ /* paste the full famousStops array from earlier code */ ];
        const summerEvents = [ /* paste the full summerEvents array from earlier code */ ];

        async function loadSharedPins() {
            const { data, error } = await supabase
                .from('route66_pins')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            patronMarkers.forEach(m => map.removeLayer(m.marker));
            patronMarkers = [];

            data.forEach(pin => {
                const popup = `<div class="popup-content"><strong>${pin.title}</strong><br><br><strong>Comment:</strong><br>${pin.comment || 'No comment.'}<br><br><small>Added: ${new Date(pin.created_at).toLocaleDateString()}</small></div>`;
                const marker = L.marker([pin.lat, pin.lng], {icon: L.divIcon({html: '🟢', iconSize: [28,28]})})
                    .addTo(map).bindPopup(popup);
                patronMarkers.push({marker, lat: pin.lat, lng: pin.lng});
            });
        }

        async function addPatronPin(lat, lng) {
            const title = prompt("Pin Title (e.g. 'Great diner here!')") || "Patron Suggestion";
            const comment = prompt("Your suggestion or comment:") || "";

            const { error } = await supabase
                .from('route66_pins')
                .insert([{ lat, lng, title, comment }]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("✅ Pin added successfully! Everyone will see it shortly.");
                loadSharedPins();
            }
        }

        function updateProgressLine() {
            if (progressLine) map.removeLayer(progressLine);
            const total = fullRouteCoords.length;
            const progPoints = Math.max(2, Math.ceil(total * (currentProgress / 100)));
            progressLine = L.polyline(fullRouteCoords.slice(0, progPoints), {
                color: '#c8102e', weight: 12, opacity: 0.95
            }).addTo(map);
            document.getElementById('progress-text').textContent = `${currentProgress}% Complete — Chicago to Santa Monica`;
        }

        function toggleAdmin() {
            const pass = prompt("Enter admin password:");
            if (pass === "route66owner2026") {  // Change this!
                const newProg = prompt("Update progress %:", currentProgress);
                if (newProg !== null) {
                    currentProgress = Math.max(0, Math.min(100, parseFloat(newProg)));
                    localStorage.setItem('route66Progress', currentProgress);
                    updateProgressLine();
                }
            }
        }

        function shareMap() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("Link copied!"));
        }

        // Load fixed markers
        famousStops.forEach(s => L.marker([s.lat, s.lng], {icon: L.divIcon({html:'🟠', iconSize:[32,32]})}).addTo(map).bindPopup(`<strong>${s.title}</strong><br>${s.desc}`));
        summerEvents.forEach(e => L.marker([e.lat, e.lng], {icon: L.divIcon({html:'⭐', iconSize:[32,32]})}).addTo(map).bindPopup(`<strong>${e.title}</strong><br><small>${e.date}</small><br>${e.desc}`));

        map.on('click', e => addPatronPin(e.latlng.lat, e.latlng.lng));

        // Init
        const saved = localStorage.getItem('route66Progress');
        if (saved) currentProgress = parseFloat(saved);
        updateProgressLine();
        loadSharedPins();   // Load all shared pins

        console.log("%cShared Route 66 map with Supabase is ready!", "color:#c8102e");
    </script>
</body>
</html>
